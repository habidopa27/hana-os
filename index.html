<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f2"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Hana OS</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f7f5f2}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:28px 18px 80px}h1{font-size:25px;margin:0}.muted{color:#777;font-size:13px}.section{padding:22px 0;border-top:1px solid #ddd}.section:first-of-type{border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #ccc;border-radius:11px;background:#fff}textarea{resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip,button{min-height:44px;border:1px solid #ccc;border-radius:999px;background:#fff;padding:9px 14px;font:inherit}.chip.on{background:#222;color:#fff;border-color:#222}.primary{background:#222;color:white;border-color:#222}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.learning,.entry,.review{border:1px solid #ddd;border-radius:14px;padding:14px;background:#fff;margin-top:10px}.small{font-size:13px}.hidden{display:none}.scores label{font-size:12px;color:#666}.scores input{margin-top:5px;color:#222}.actions{display:flex;gap:8px;flex-wrap:wrap}.review h3{font-size:12px;letter-spacing:.08em;color:#777;margin:18px 0 6px}.review h3:first-child{margin-top:0}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}@media(display-mode:standalone){main{padding-top:45px}}</style></head><body><main><header class="row"><div><h1>Hana OS</h1><div class="muted">Record what happened, what changed, what you learned.</div></div><input id="date" class="field" style="width:auto" type="date"></header>
<section class="section scores"><h2>Check-in</h2><div class="grid"><label>Mood<input id="mood" class="field" type="number" min="1" max="10" placeholder="1–10"></label><label>Stress<input id="stress" class="field" type="number" min="1" max="10" placeholder="1–10"></label><label>Inner peace<input id="peace" class="field" type="number" min="1" max="10" placeholder="1–10"></label><label>Overall day<input id="overall" class="field" type="number" min="1" max="10" placeholder="1–10"></label></div></section>
<section class="section"><h2>What I did</h2><div id="chips" class="chips"></div><input id="activityOther" class="field hidden" style="margin-top:10px" placeholder="Specify other"><textarea id="did" class="field" rows="4" style="margin-top:10px" placeholder="What happened today? What did I do?"></textarea></section>
<section class="section"><div class="row"><div><h2 style="margin-bottom:3px">What I learned</h2><div class="muted">Capture something worth keeping.</div></div><button id="addLearn">+ Add</button></div><div id="learnList"></div></section>
<section class="section"><h2>Journal <span class="muted">· optional</span></h2><textarea id="journal" class="field" rows="7" placeholder="Thoughts, emotions, conversations, ideas..."></textarea></section>
<section class="section"><div class="actions"><button id="save" class="primary">Save day</button><button id="clear">Clear</button><button id="export">Export backup</button><label style="display:inline-flex;align-items:center"><span class="chip">Import backup</span><input id="import" type="file" accept="application/json" hidden></label></div><p id="status" class="muted"></p></section>
<section class="section"><div class="row"><div><h2 style="margin-bottom:3px">Weekly review</h2><div class="muted">Uses the latest 7 calendar days in your saved data.</div></div><button id="reviewBtn">Review my week</button></div><div id="review"></div></section>
<section class="section"><div class="row"><h2>History</h2><span id="count" class="muted"></span></div><div id="history"></div></section></main>
<script>
const KEY='hanaOS.v1.entries'; const acts=['Work','Exercise','Reading','AI','Finance','Career','Social','Me time','Creative','Other']; const cats=['Reading','AI','Finance','Career','Health / Nutrition','Language','Life','Other']; let entries=loadStore(), selected=new Set(); const $=x=>document.getElementById(x); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){let d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())} $('date').value=today();
function loadStore(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}} function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
acts.forEach(a=>{let b=document.createElement('button');b.type='button';b.className='chip';b.textContent=a;b.dataset.a=a;b.onclick=()=>{selected.has(a)?selected.delete(a):selected.add(a);b.classList.toggle('on',selected.has(a));$('activityOther').classList.toggle('hidden',!selected.has('Other'));if(!selected.has('Other'))$('activityOther').value=''};$('chips').appendChild(b)});
function addLearning(v={}){let d=document.createElement('div');d.className='learning';d.innerHTML='<div class="row"><select class="field cat" style="flex:1"><option value="">Category</option>'+cats.map(x=>'<option>'+x+'</option>').join('')+'</select><button class="remove" type="button">×</button></div><input class="field other hidden" style="margin-top:8px" placeholder="Specify category"><textarea class="field text" rows="3" style="margin-top:8px" placeholder="What did I learn / understand / want to remember?"></textarea><textarea class="field thought" rows="2" style="margin-top:8px" placeholder="My own thought (optional)"></textarea>';let c=d.querySelector('.cat'),o=d.querySelector('.other');c.value=v.category||'';o.value=v.other||'';d.querySelector('.text').value=v.text||'';d.querySelector('.thought').value=v.thought||'';function t(){o.classList.toggle('hidden',c.value!=='Other');if(c.value!=='Other')o.value=''}c.onchange=t;d.querySelector('.remove').onclick=()=>d.remove();t();$('learnList').appendChild(d)} $('addLearn').onclick=()=>addLearning();addLearning();
function score(id){let n=Number($(id).value);return Number.isInteger(n)&&n>=1&&n<=10?n:null} function learn(){return [...document.querySelectorAll('.learning')].map(d=>({category:d.querySelector('.cat').value,other:d.querySelector('.other').value.trim(),text:d.querySelector('.text').value.trim(),thought:d.querySelector('.thought').value.trim()})).filter(x=>x.category||x.text||x.thought)}
function clearForm(){['mood','stress','peace','overall','activityOther','did','journal'].forEach(x=>$(x).value='');selected.clear();document.querySelectorAll('#chips .chip').forEach(b=>b.classList.remove('on'));$('activityOther').classList.add('hidden');$('learnList').innerHTML='';addLearning()}
$('clear').onclick=()=>{clearForm();$('status').textContent='Cleared.'};
$('save').onclick=()=>{let e={date:$('date').value,mood:score('mood'),stress:score('stress'),peace:score('peace'),overall:score('overall'),activities:[...selected],activityOther:$('activityOther').value.trim(),did:$('did').value.trim(),learning:learn(),journal:$('journal').value.trim()};if(!e.date||[e.mood,e.stress,e.peace,e.overall].some(x=>x===null))return $('status').textContent='Enter date and all four scores from 1–10.';if(selected.has('Other')&&!e.activityOther)return $('status').textContent='Specify Other activity.';if(e.learning.some(x=>!x.text))return $('status').textContent='Each learning entry needs a takeaway, or remove it.';if(e.learning.some(x=>x.category==='Other'&&!x.other))return $('status').textContent='Specify Other learning category.';let i=entries.findIndex(x=>x.date===e.date);if(i>=0)entries[i]=e;else entries.push(e);entries.sort((a,b)=>a.date.localeCompare(b.date));persist();render();$('status').textContent=(i>=0?'Updated ':'Saved ')+e.date+'. Data is stored on this device/browser.'};
function edit(date){let e=entries.find(x=>x.date===date);if(!e)return;clearForm();$('date').value=e.date;['mood','stress','peace','overall'].forEach(x=>$(x).value=e[x]);$('did').value=e.did||'';$('journal').value=e.journal||'';e.activities.forEach(x=>selected.add(x));document.querySelectorAll('#chips .chip').forEach(b=>b.classList.toggle('on',selected.has(b.dataset.a)));if(selected.has('Other')){$('activityOther').classList.remove('hidden');$('activityOther').value=e.activityOther||''}$('learnList').innerHTML='';(e.learning||[]).forEach(addLearning);if(!e.learning?.length)addLearning();window.scrollTo({top:0,behavior:'smooth'})}
function render(){ $('count').textContent=entries.length+' saved day'+(entries.length===1?'':'s');$('history').innerHTML=entries.slice().reverse().map(e=>'<div class="entry"><div class="row"><strong>'+e.date+'</strong><div><button data-e="'+e.date+'">Edit</button> <button data-d="'+e.date+'">Delete</button></div></div><div class="small" style="margin-top:7px">Mood '+e.mood+' · Stress '+e.stress+' · Peace '+e.peace+' · Overall '+e.overall+'</div>'+(e.activities.length?'<div class="muted" style="margin-top:6px">'+e.activities.map(esc).join(' · ')+'</div>':'')+(e.did?'<p class="small">'+esc(e.did).replace(/\n/g,'<br>')+'</p>':'')+(e.learning?.length?'<div class="small"><strong>Learned</strong>'+e.learning.map(x=>'<div>• '+esc(x.text)+'</div>').join('')+'</div>':'')+(e.journal?'<details class="small" style="margin-top:8px"><summary>Journal</summary><p>'+esc(e.journal).replace(/\n/g,'<br>')+'</p></details>':'')+'</div>').join('');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete '+b.dataset.d+'?')){entries=entries.filter(x=>x.date!==b.dataset.d);persist();render()}})}
$('reviewBtn').onclick=()=>{if(!entries.length)return $('review').innerHTML='<p class="muted">No saved data yet.</p>';let end=entries[entries.length-1].date,ed=new Date(end+'T00:00:00'),sd=new Date(ed);sd.setDate(sd.getDate()-6);let start=sd.toISOString().slice(0,10),w=entries.filter(x=>x.date>=start&&x.date<=end);let avg=k=>(w.reduce((s,x)=>s+x[k],0)/w.length).toFixed(1),counts={};w.forEach(x=>x.activities.forEach(a=>counts[a]=(counts[a]||0)+1));let learned=w.flatMap(x=>x.learning||[]),days=w.filter(x=>x.did),journals=w.filter(x=>x.journal);$('review').innerHTML='<div class="review"><h3>DATA SAYS</h3><p class="small">'+start+' → '+end+' · '+w.length+' recorded day'+(w.length===1?'':'s')+'</p><p><strong>Mood '+avg('mood')+'</strong> · Stress '+avg('stress')+' · Inner peace '+avg('peace')+' · Overall '+avg('overall')+'</p><p class="small"><strong>Activity evidence:</strong> '+(Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([a,n])=>a+' ×'+n).join(' · ')||'None')+'</p><h3>MY WEEK</h3>'+(days.length?days.map(x=>'<p class="small"><strong>'+x.date+'</strong> — '+esc(x.did)+'</p>').join(''):'<p class="muted">Nothing recorded.</p>')+'<h3>WHAT I LEARNED</h3>'+(learned.length?learned.map(x=>'<p class="small">• '+esc(x.text)+'</p>').join(''):'<p class="muted">Nothing recorded.</p>')+'<h3>JOURNAL EVIDENCE</h3><p class="small">'+journals.length+' journal entr'+(journals.length===1?'y':'ies')+' available for a future AI synthesis.</p><h3>AI INTERPRETATION</h3><p class="muted">Reserved for the AI layer. It will receive this structured review plus journal evidence and clearly separate observed facts from possible interpretations.</p></div>'};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),entries},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='hana-os-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.entries))throw 0;if(confirm('Replace current Hana OS data with this backup?')){entries=x.entries;persist();render();$('status').textContent='Backup imported.'}}catch{$('status').textContent='Could not import this backup.'}ev.target.value=''};
render(); if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
